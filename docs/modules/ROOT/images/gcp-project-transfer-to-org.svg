<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"
     aria-label="Three steps: a personal account cannot join the organization; an org account is granted Owner on the project and Mover on the organization; the org account then moves the project.">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .h { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .b { font-size: 12px; fill: #333; }
      .s { font-size: 11px; fill: #666; }
      .step { font-size: 11px; font-weight: 700; fill: #fff; }
      .box { fill: #fff; stroke: #c8cdd4; stroke-width: 1.5; rx: 6; }
      .bad { fill: #fdf1f0; stroke: #d4837c; }
      .good { fill: #f1f8f3; stroke: #7fae8c; }
      .key { fill: #fff8e8; stroke: #d4a95c; stroke-width: 2; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <!-- STEP 1 -->
  <circle cx="22" cy="34" r="11" fill="#555"/><text class="t step" x="22" y="38" text-anchor="middle">1</text>
  <text class="t h" x="42" y="30">A personal account can never do this</text>
  <text class="t s" x="42" y="46">A Cloud Identity organization cannot hold a personal Google account as a member.</text>

  <rect class="box" x="42" y="60" width="240" height="62"/>
  <text class="t b" x="58" y="82">Personal account</text>
  <text class="t s" x="58" y="99">you@gmail.com</text>
  <text class="t s" x="58" y="114">owns project “my-project”</text>

  <line x1="292" y1="91" x2="452" y2="91" stroke="#d4837c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="360" y1="79" x2="384" y2="103" stroke="#d4837c" stroke-width="2.5"/>
  <line x1="384" y1="79" x2="360" y2="103" stroke="#d4837c" stroke-width="2.5"/>
  <text class="t s" x="372" y="72" text-anchor="middle" fill="#b5544c">blocked</text>

  <rect class="box bad" x="462" y="60" width="240" height="62"/>
  <text class="t b" x="478" y="82">Organization</text>
  <text class="t s" x="478" y="99">yourdomain.org (Cloud Identity)</text>
  <text class="t s" x="478" y="114">members must be org accounts</text>

  <!-- STEP 2 -->
  <circle cx="22" cy="170" r="11" fill="#555"/><text class="t step" x="22" y="174" text-anchor="middle">2</text>
  <text class="t h" x="42" y="166">Bridge with an org account — two grants, two different pages</text>
  <text class="t s" x="42" y="182">This is where the hour goes. The grants live on separate IAM surfaces.</text>

  <rect class="box" x="42" y="196" width="300" height="76"/>
  <text class="t b" x="58" y="218">Grant A — on the PROJECT</text>
  <text class="t s" x="58" y="236">Project IAM → add you@yourdomain.org</text>
  <text class="t s" x="58" y="251">Role: Owner</text>
  <text class="t s" x="58" y="266" fill="#7a7a7a">Console → project → IAM &amp; Admin</text>

  <rect class="box key" x="372" y="196" width="330" height="76"/>
  <text class="t b" x="388" y="218">Grant B — on the ORGANIZATION</text>
  <text class="t s" x="388" y="236">Organization IAM → add you@yourdomain.org</text>
  <text class="t s" x="388" y="251">Role: Project Mover (Owner also works)</text>
  <text class="t s" x="388" y="266" fill="#a8791f">⚠ Not the project’s IAM page — the org’s</text>

  <!-- STEP 3 -->
  <circle cx="22" cy="322" r="11" fill="#555"/><text class="t step" x="22" y="326" text-anchor="middle">3</text>
  <text class="t h" x="42" y="318">Sign in as the org account and move it</text>

  <rect class="box good" x="42" y="344" width="200" height="58"/>
  <text class="t b" x="58" y="366">Sign in</text>
  <text class="t s" x="58" y="384">as you@yourdomain.org</text>

  <line x1="252" y1="373" x2="292" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box good" x="302" y="344" width="200" height="58"/>
  <text class="t b" x="318" y="366">⋮ menu → Settings</text>
  <text class="t s" x="318" y="384">org settings → Migrate/Transfer</text>

  <line x1="512" y1="373" x2="552" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect class="box good" x="562" y="344" width="140" height="58"/>
  <text class="t b" x="578" y="366">Verify</text>
  <text class="t s" x="578" y="384">project → “All” tab</text>
</svg>
